
name: ADELAN APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ADELAN project
        run: |
          mkdir -p project
          unzip -o ADELAN_GitHub_Build_Ready_FIXED.zip -d project
          echo "Project files:"
          find project -maxdepth 4 -type f | head -200

      - name: Locate Android Gradle project
        id: locate
        run: |
          ROOT=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "No Gradle project files found in the ZIP."
            exit 1
          fi
          echo "dir=$(dirname "$ROOT")" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADELAN-APK
          path: project/**/*.apk
          if-no-files-found: error
